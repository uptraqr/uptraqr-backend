<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Uptraqr</title>

    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; border: 1px solid #334155; }
        .logo { font-size: 28px; font-weight: 700; color: #38bdf8; text-align: center; margin-bottom: 8px; }
        .logo span { color: #e2e8f0; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 15px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #cbd5e1; }
        input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 15px; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 13px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #7dd3fc; }
        .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; }

        @media (max-width: 768px) {
    .card { padding: 24px 20px; margin: 20px; }
}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">up<span>traqr</span></div>
        <div class="subtitle">Sign in to your account</div>

        <form method="POST" action="/api/auth/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="/signup">Sign up free</a>
        </div>
    </div>
</body>
</html>
