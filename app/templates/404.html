<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Uptraqr</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 40px; }
        .code { font-size: 120px; font-weight: 800; color: #38bdf8; line-height: 1; margin-bottom: 16px; }
        .pulse { display: inline-block; width: 16px; height: 16px; background: #ef4444; border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 16px; margin-bottom: 40px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .status { display: inline-flex; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 8px 20px; border-radius: 20px; font-size: 14px; color: #94a3b8; margin-bottom: 40px; }
        .btn { display: inline-block; background: #38bdf8; color: #0f172a; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 16px; margin: 0 8px; }
        .btn:hover { background: #7dd3fc; }
        .btn-secondary { background: transparent; color: #e2e8f0; border: 1px solid #334155; }
        .btn-secondary:hover { border-color: #38bdf8; color: #38bdf8; background: transparent; }
        .logo { font-size: 24px; font-weight: 700; color: #38bdf8; text-decoration: none; display: block; margin-bottom: 40px; }
        .logo span { color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="logo">up<span>traqr</span></a>
        <div class="code">404</div>
        <div class="status">
            <span class="pulse"></span>
            Page not found
        </div>
        <h1>This page doesn't exist</h1>
        <p>The page you're looking for has gone offline — ironic for an uptime monitoring service, we know.</p>
        <div>
            <a href="/" class="btn">Go Home</a>
            <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>
</body>
</html>
